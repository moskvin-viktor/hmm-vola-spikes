[project]
name = "hmmstock"
version = "0.1.0"
description = "HMM-based stock regime detection and visualization app"
authors = [{ name = "Viktor Moskvin", email = "moskvin_viktor@pm.me" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.22.0",
    "plotly>=5.10.0",
    "dash>=2.9.0",
    "hmmlearn>=0.2.8",
    "joblib>=1.2.0",
    "omegaconf>=2.3.0",
    "scikit-learn>=1.0.2",
    "yfinance==0.2.54",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.26.1",
    "pymdown-extensions>=10.15",
    "python-markdown-math>=0.9",
]

[project.optional-dependencies]
dev = ["black", "flake8", "ipykernel", "jupyterlab", "notebook", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmmstock"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
fmt = "black src tests"
lint = "flake8 src tests"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
